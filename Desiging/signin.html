<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saarthi.AI - Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .form-container {
      max-width: 500px;
      background-color: #d1f7d1;
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #004d1a;
      margin: 60px auto;
    }

    .btn-green {
      background-color: #004d1a;
      color: white;
    }

    .btn-green:hover {
      background-color: #006622;
    }

    .form-check-label {
      font-size: 0.9rem;
    }

    .social-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      color: white;
      border: none;
      margin: 0 10px;
    }

    .google-btn {
      background-color: #db4437;
    }

    .facebook-btn {
      background-color: #3b5998;
    }

    .apple-btn {
      background-color: #000000;
    }

    .navbar-brand img {
      width: 40px;
      height: 40px;
    }

    .nav-link {
      font-weight: 600;
      color: #004d1a;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center text-success fw-bold" href="#">
        <img src="Selection (2).png" class="me-2" alt="Logo">
        <span>Saarthi.AI</span>
      </a>
      <div class="ms-auto d-flex align-items-center">
        <a class="nav-link me-3" href="#">About</a>
        <a class="nav-link me-3" href="#">Help</a>
        <a class="nav-link me-3" href="#">How it works?</a>
        <div class="rounded-circle border border-success d-flex justify-content-center align-items-center"
          style="width: 35px; height: 35px;">
          <span class="text-success fw-bold">A</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Sign In Form -->
  <div class="form-container shadow">
    <h4 class="mb-4 fw-bold">Sign in</h4>

    <form>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" placeholder="Enter your email">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold d-flex justify-content-between">
          <span>Password</span>
          <a href="#" class="text-decoration-none text-success" style="font-size: 0.8rem;">Forgot password?</a>
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" placeholder="Enter your password" id="password">
          <span class="input-group-text" onclick="togglePassword()">
            <i class="bi bi-eye-slash" id="toggleIcon"></i>
          </span>
        </div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" checked>
        <label class="form-check-label">Remember me</label>
      </div>

      <button type="submit" class="btn btn-green w-100">Sign in</button>

      <p class="mt-3 text-center">Don't have an account? <a href="#">Sign up</a></p>

      <div class="text-center my-2 text-muted">OR</div>

      <div class="d-flex justify-content-center">
        <button type="button" class="social-icon-btn google-btn"><i class="bi bi-google"></i></button>
        <button type="button" class="social-icon-btn facebook-btn"><i class="bi bi-facebook"></i></button>
        <button type="button" class="social-icon-btn apple-btn"><i class="bi bi-apple"></i></button>
      </div>
    </form>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const toggleIcon = document.getElementById("toggleIcon");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleIcon.classList.remove("bi-eye-slash");
        toggleIcon.classList.add("bi-eye");
      } else {
        passwordInput.type = "password";
        toggleIcon.classList.remove("bi-eye");
        toggleIcon.classList.add("bi-eye-slash");
      }
    }
  </script>

</body>

</html>
