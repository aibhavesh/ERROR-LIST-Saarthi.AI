<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan My EcoTrip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #ffffff;
    }

    .eco-trip-container {
      background-color: #d1f7d1;
      border-radius: 10px;
      padding: 30px;
    }

    .eco-form {
      background-color: #ffffff;
      border-radius: 10px;
      padding: 20px;
    }

    .btn-eco {
      background-color: #006622;
      color: white;
      font-weight: bold;
    }

    .btn-eco:hover {
      background-color: #004d1a;
    }

    .ai-image {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .eco-heading {
      font-weight: 700;
      color: #006622;
    }

    .eco-subheading {
      font-size: 1rem;
      color: #444;
    }

    @media (max-width: 768px) {
      .form-col {
        margin-bottom: 30px;
      }
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center text-success fw-bold" href="#">
        <img src="Selection (2).png" width="30" height="30" class="me-2" alt="Logo" />
        Saarthi.AI
      </a>
      <div class="ms-auto d-flex align-items-center">
        <a class="nav-link me-3" href="#">About</a>
        <a class="nav-link me-3" href="#">Help</a>
        <a class="nav-link me-3" href="#">How it works?</a>
        <a class="nav-link me-2 fw-bold text-success" href="#">Login</a>
        <button class="btn btn-outline-success btn-sm me-2">Sign Up</button>
        <div class="rounded-circle bg-dark text-white d-flex justify-content-center align-items-center"
          style="width: 35px; height: 35px;">
          <span>A</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- EcoTrip Section -->
  <div class="container my-5">
    <div class="row align-items-center">
      <!-- Form Section -->
      <div class="col-md-6 form-col">
        <div class="eco-trip-container">
          <h4 class="eco-heading mb-2">
            <img src="Selection (2).png" width="25" class="me-2" /> Plan My EcoTrip
          </h4>
          <p class="eco-subheading mb-4">Smart, Sustainable, and Savvy Urban Travel</p>
          <div class="eco-form">
            <form>
              <div class="mb-3">
                <label class="form-label fw-semibold">From:</label>
                <input type="text" class="form-control" placeholder="Enter start location" />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">To:</label>
                <input type="text" class="form-control" placeholder="Enter destination" />
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Priority:</label>
                <select class="form-select">
                  <option>Lowest CO Emission</option>
                  <option>Fastest Route</option>
                  <option>Cheapest Route</option>
                </select>
              </div>
              <button type="submit" class="btn btn-eco w-100">Plan My ECOTrip</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Image Section -->
      <div class="col-md-6 text-center">
        <img src="WhatsApp Image 2025-04-18 at 22.34.44_1fca03f5.jpg" alt="AI Art" class="ai-image" />
      </div>
    </div>
  </div>

</body>

</html>
