<html lang="en">

    }
    .custom-dropdown {
      position: absolute;
      top: 70px;

      background-color: white;

    }
    .custom-dropdown.active { display: block; }
    .dropdown-header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #eee; }
    .dropdown-header img { width: 45px; height: 45px; border-radius: 50%; margin-right: 10px; }
    .dropdown-header .info small { color: gray; }
    .dropdown-item { display: flex; align-items: center; padding: 10px 15px; color: #333; text-decoration: none; }
    .dropdown-item i { margin-right: 10px; }
    .dropdown-item:hover { background-color: #f8f9fa; }
    .switch-container { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; }
    .hero-title { font-family: var(--font-heading); font-size: 2.2rem; background: linear-gradient(90deg, var(--eco-green), var(--neon-blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: gradientText 3s ease-in-out infinite alternate; text-align: center; margin-bottom: 1rem; letter-spacing: 1.5px; }
    @keyframes gradientText { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    .glass-card { background: rgba(16, 19, 26, 0.6); border-radius: 1.5rem; border: 1.5px solid #00eaff44; box-shadow: 0 4px 32px #00eaff22, 0 0 0 1.5px #1fa65044; backdrop-filter: blur(8px); transition: transform 0.2s, box-shadow 0.2s; }
    .glass-card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 8px 48px #1fa65055, 0 0 0 2.5px #00eaff99; }
    .fade-in-section { opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(.4,0,.2,1), transform 0.8s cubic-bezier(.4,0,.2,1); }
    .fade-in-section.visible { opacity: 1; transform: none; }
    .trip-form {
      background: rgba(16, 19, 26, 0.7);
      border-radius: 1.5rem;
      box-shadow: 0 4px 32px #1fa65022, 0 0 0 1.5px #00eaff44;
      padding: 2.5rem 2rem;
      border: 1.5px solid #00eaff44;
      color: #fff;
    }
    .form-label { color: var(--eco-green); font-weight: 600; }
    .btn-green {
      background: linear-gradient(90deg, var(--eco-green), var(--neon-blue));
      color: #fff;
      border: none;
      font-weight: 600;
      box-shadow: var(--glow-green);
      transition: background 0.2s, box-shadow 0.2s;

    .btn-green:hover {

      box-shadow: var(--glow-blue);
    }
    @media (max-width: 600px) {

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top position-relative">

  <!-- Plan My Trip Section -->
  <section class="container py-5 fade-in-section">
    <h2 class="hero-title mb-4">Plan My Trip</h2>
    <div class="row align-items-center">
      <div class="col-lg-7">
        <form class="trip-form glass-card">
          <div class="mb-3">
            <label for="from" class="form-label">From</label>
            <input type="text" class="form-control" id="from" placeholder="Enter starting point">
          </div>
          <div class="mb-3">
            <label for="to" class="form-label">To</label>
            <input type="text" class="form-control" id="to" placeholder="Enter destination">
          </div>
          <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date">
          </div>
          <div class="mb-3">
            <label for="mode" class="form-label">Mode of Transport</label>
            <select class="form-select" id="mode">
              <option>Bus</option>
              <option>Metro</option>
              <option>Bike</option>
              <option>Car</option>
              <option>Walk</option>
            </select>
          </div>
          <button type="submit" class="btn btn-green w-100">Plan Trip</button>
        </form>
      </div>
      <div class="col-lg-5 text-center">
        <!-- 3D Globe -->
        <div class="globe-container position-relative mx-auto mb-4">
          <canvas id="globe3d"></canvas>
          <svg class="particles" width="100%" height="100%">
            <circle cx="50%" cy="50%" r="48%" fill="none" stroke="#00eaff88" stroke-width="2" stroke-dasharray="8 12">
              <animate attributeName="stroke-dashoffset" from="0" to="40" dur="3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="50%" cy="50%" r="38%" fill="none" stroke="#1fa65088" stroke-width="2" stroke-dasharray="6 10">
              <animate attributeName="stroke-dashoffset" from="0" to="30" dur="2.2s" repeatCount="indefinite"/>
            </circle>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <!-- Fade-in Animation Script -->
  <script>
    // Fade-in on scroll
    function revealOnScroll() {
      document.querySelectorAll('.fade-in-section').forEach(function(section) {
        const rect = section.getBoundingClientRect();
        if (rect.top < window.innerHeight - 60) {
          section.classList.add('visible');
        }
      });
    }
    window.addEventListener('scroll', revealOnScroll);
    window.addEventListener('DOMContentLoaded', revealOnScroll);
  </script>
  <!-- Three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
  <script>
    // Interactive Three.js Globe with Texture and Glow
    const canvas = document.getElementById('globe3d');
    if (canvas) {
      const width = canvas.parentElement.offsetWidth;
      const height = canvas.parentElement.offsetHeight;
      canvas.width = width;
      canvas.height = height;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, width/height, 0.1, 1000);
      camera.position.z = 2.8;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setSize(width, height);
      // Earth sphere with texture
      const geometry = new THREE.SphereGeometry(1, 64, 64);
      const texture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg');
      const material = new THREE.MeshPhongMaterial({
        map: texture,
        shininess: 30,
        emissive: 0x00eaff,
        emissiveIntensity: 0.12,
        specular: 0x1fa650,
        color: 0xffffff
      });
      const globe = new THREE.Mesh(geometry, material);
      scene.add(globe);
      // Glow effect
      const glowMaterial = new THREE.MeshBasicMaterial({ color: 0x00eaff, transparent: true, opacity: 0.18 });
      const glow = new THREE.Mesh(new THREE.SphereGeometry(1.08, 64, 64), glowMaterial);
      scene.add(glow);
      // Lighting
      const ambient = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0x1fa650, 1.2);
      dirLight.position.set(2, 2, 2);
      scene.add(dirLight);
      // Interactivity: rotate globe with mouse
      let isDragging = false;
      let previousMousePosition = { x: 0, y: 0 };
      canvas.addEventListener('mousedown', function(e) {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('mouseup', function() { isDragging = false; });
      canvas.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
        globe.rotation.y += deltaMove.x * 0.01;
        globe.rotation.x += deltaMove.y * 0.01;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });
      // Animation loop
      function animate() {
        globe.rotation.y += 0.003;
        glow.rotation.y += 0.002;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();
      // Responsive
      window.addEventListener('resize', () => {
        const w = canvas.parentElement.offsetWidth;
        const h = canvas.parentElement.offsetHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      });
    }
    // Profile dropdown logic
    const profileBtn = document.getElementById("profileBtn");
    const dropdown = document.getElementById("dropdownMenu");
    profileBtn.addEventListener("click", () => {
      dropdown.classList.toggle("active");
    });
    document.addEventListener("click", function (e) {
      if (!profileBtn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove("active");
      }
    });
    // Night mode toggle
    const nightSwitch = document.getElementById('nightSwitch');
    nightSwitch.addEventListener('change', function() {
      if (this.checked) {
        document.body.style.background = 'linear-gradient(135deg, #10131a 60%, #00eaff 100%)';
        document.body.style.color = '#fff';
      } else {
        document.body.style.background = 'linear-gradient(135deg, #fff 60%, #1fa650 100%)';
        document.body.style.color = '#10131a';
      }
    });
  </script>
</body>
